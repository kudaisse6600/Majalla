<!doctype html>
<html lang="dv" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Online</title><meta name="description" content="One Online article"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Thaana:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Noto Sans Thaana','Inter',sans-serif}</style></head>
<body class="min-h-screen bg-slate-50"><header class="border-b bg-white"><div class="mx-auto max-w-4xl px-4 py-5"><a href="/" class="font-sans text-xl font-extrabold" dir="ltr">ONE<span class="text-cyan-700">ONLINE</span></a></div></header><main class="mx-auto max-w-4xl px-4 py-8"><a href="/" class="text-sm font-bold text-cyan-800">← ފަހަތަށް</a><article id="article" class="mt-5 rounded-3xl border border-slate-200 bg-white p-5 sm:p-10"><p class="text-sm text-slate-500">Loading article…</p></article></main>
<script>const slug=new URLSearchParams(location.search).get('slug');const el=document.querySelector('#article');function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}(async()=>{if(!slug){el.textContent='Article not found.';return}try{const r=await fetch('/api/articles/'+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw Error(d.error);const a=d.article;document.title=(a.seo_title||a.title)+' | One Online';document.querySelector('meta[name=description]').content=a.seo_description||a.excerpt||a.title;el.innerHTML=`<p class="text-sm font-bold text-cyan-800">${esc(a.category_name||'ޚަބަރު')}</p><h1 class="mt-3 text-2xl font-extrabold leading-relaxed sm:text-4xl">${esc(a.title)}</h1><p class="mt-4 text-sm text-slate-500">${a.published_at?new Date(a.published_at).toLocaleString():''}</p>${a.cover_image?`<img class="mt-7 max-h-[520px] w-full rounded-2xl object-cover" src="${esc(a.cover_image)}" alt="${esc(a.title)}">`:''}<p class="mt-7 whitespace-pre-wrap text-base leading-9 text-slate-700">${esc(a.body)}</p>`}catch(e){el.textContent=e.message||'Unable to load article.'}})()</script></body></html>
