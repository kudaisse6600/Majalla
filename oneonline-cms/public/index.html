<!doctype html>
<html lang="dv" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Online — އައު ޚަބަރު</title><meta name="description" content="One Online — latest news from Maldives and around the world.">
<script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thaana:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans Thaana','Inter',sans-serif}.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 14px 35px #10233512}</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur"><div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4"><a href="/" class="font-sans text-xl font-extrabold tracking-tight" dir="ltr">ONE<span class="text-cyan-700">ONLINE</span></a><div class="flex gap-2"><input id="q" class="w-36 rounded-xl border border-slate-200 px-3 py-2 text-sm sm:w-60" placeholder="ޚަބަރު ހޯދާ..." aria-label="Search articles"><button id="search" class="rounded-xl bg-[#0b6e8e] px-4 py-2 text-sm font-bold text-white">ހޯދާ</button><a href="/admin" class="rounded-xl bg-slate-100 px-3 py-2 text-sm font-bold">Admin</a></div></div></header>
<main class="mx-auto max-w-7xl px-4 py-8 sm:py-12"><section class="mb-8 rounded-3xl bg-gradient-to-br from-[#071a2b] to-[#0b6e8e] p-7 text-white sm:p-10"><p class="mb-3 text-xs font-bold tracking-widest text-cyan-200">ONE ONLINE NEWSROOM</p><h1 class="text-3xl font-extrabold leading-relaxed sm:text-5xl">ރާއްޖޭގެ ޚަބަރު، އެއްތަނެއްގައި</h1><p class="mt-4 max-w-2xl text-sm leading-8 text-slate-200">ރާއްޖެ، ދުނިޔެ، ކުޅިވަރު އަދި ވިޔަފާރިގެ އައު ޚަބަރު.</p></section>
<div class="mb-5 flex items-end justify-between gap-3"><div><p class="text-xs font-bold tracking-widest text-cyan-800">LATEST STORIES</p><h2 class="mt-1 text-2xl font-extrabold">ފަހުގެ ޚަބަރު</h2></div><select id="category" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm"><option value="">ހުރިހާ ބައިތައް</option></select></div>
<div id="status" class="mb-4 text-sm text-slate-500">Loading articles…</div><div id="articles" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div><div class="mt-8 flex justify-center gap-3"><button id="prev" class="rounded-xl border bg-white px-4 py-2 font-bold">← Previous</button><span id="pageLabel" class="self-center text-sm text-slate-500"></span><button id="next" class="rounded-xl border bg-white px-4 py-2 font-bold">Next →</button></div>
</main><footer class="border-t border-slate-200 bg-white py-6 text-center text-sm text-slate-500">© <span id="year"></span> One Online</footer>
<script>
const $=s=>document.querySelector(s);let page=1,pages=1,query='';
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const params=new URLSearchParams({page,limit:12});if(query)params.set('q',query);if($('#category').value)params.set('category',$('#category').value);try{const r=await fetch('/api/articles?'+params);const d=await r.json();if(!r.ok)throw Error(d.error);pages=Math.max(1,d.pages);$('#status').textContent=d.total?`${d.total} ޚަބަރު`:'އަދި ޚަބަރެއް ޕަބްލިޝްކުރެވިފައެއް ނެތް.';$('#articles').innerHTML=d.articles.map(a=>`<article class="card overflow-hidden rounded-2xl border border-slate-200 bg-white">${a.cover_image?`<img class="h-48 w-full object-cover" src="${esc(a.cover_image)}" alt="${esc(a.title)}" loading="lazy">`:'<div class="grid h-32 place-items-center bg-gradient-to-br from-sky-50 to-slate-100 text-3xl text-cyan-800">ONE</div>'}<div class="p-5"><p class="text-xs font-bold text-cyan-800">${esc(a.category_name||'ޚަބަރު')}</p><h3 class="mt-2 text-lg font-extrabold leading-8">${esc(a.title)}</h3><p class="mt-3 text-sm leading-7 text-slate-500">${esc(a.excerpt||'')}</p><a href="/article.html?slug=${encodeURIComponent(a.slug)}" class="mt-4 inline-block text-sm font-bold text-cyan-800">އިތުރަށް ކިޔާ ←</a><p class="mt-4 text-xs text-slate-400">${a.published_at?new Date(a.published_at).toLocaleDateString():''}</p></div></article>`).join('');$('#pageLabel').textContent=`${page} / ${pages}`;$('#prev').disabled=page<=1;$('#next').disabled=page>=pages}catch(e){$('#status').textContent='Unable to load articles: '+e.message}}
async function loadCategories(){try{const d=await (await fetch('/api/categories')).json();$('#category').innerHTML='<option value="">ހުރިހާ ބައިތައް</option>'+d.categories.map(c=>`<option value="${esc(c.slug)}">${esc(c.name)}</option>`).join('')}catch{}}
$('#search').onclick=()=>{query=$('#q').value.trim();page=1;load()};$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')$('#search').click()});$('#category').onchange=()=>{page=1;load()};$('#prev').onclick=()=>{if(page>1){page--;load()}};$('#next').onclick=()=>{if(page<pages){page++;load()}};$('#year').textContent=new Date().getFullYear();loadCategories().then(load);
</script></body></html>
